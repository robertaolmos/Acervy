<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        form,
        table {
            background: #fff;
            padding: 10px;
            margin-bottom: 15px;
        }

        input {
            padding: 5px;
            margin-right: 5px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            border-bottom: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }

        .atrasado {
            color: red;
            font-weight: bold;
        }

        .abas button {
            margin-right: 4px;
        }
    </style>
</head>

<body>

    <h1>Biblioteca</h1>

    <form onsubmit="cadastrarLivro(); return false;">
        <b>Cadastrar livro:</b>

        <input id="t" placeholder="Título">
        <input id="a" placeholder="Autor">
        <input id="y" placeholder="Ano" type="number">

        <button>Cadastrar</button>
    </form>

    <div class="abas">
        <button onclick="mostrarLista('todos')">
            Cadastrados
        </button>

        <button onclick="mostrarLista('disp')">
            Disponíveis
        </button>

        <button onclick="mostrarLista('pend')">
            Pendentes de devolução
        </button>

        <button onclick="mostrarLista('dev')">
            Devolvidos
        </button>
    </div>

    <br>

    <table id="tb"></table>

    <script src="script.js"></script>

</body>
</html>
